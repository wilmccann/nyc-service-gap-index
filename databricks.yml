# NYC Service Gap Index — Databricks Asset Bundle (DAB)
# ---------------------------------------------------------------------------
# Packages the raw CSVs, the ingest + build notebooks, a job that runs them,
# and the Lakeview dashboard so the whole project can be deployed to any
# Databricks workspace with three commands:
#
#   databricks bundle validate --target dev --var="warehouse_id=<id>"
#   databricks bundle deploy   --target dev --var="warehouse_id=<id>"
#   databricks bundle run build_tables --target dev --var="warehouse_id=<id>"
#
# Full step-by-step instructions: README.md
# ---------------------------------------------------------------------------

bundle:
  name: nyc_service_gap_index

variables:
  warehouse_id:
    description: >-
      ID of the SQL warehouse the dashboard should query. There is no default
      on purpose: every workspace has different warehouses. Find yours with
      `databricks warehouses list` and pass it as --var="warehouse_id=<id>".

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  # --- Volume: where the raw CSVs live ------------------------------------
  # Data files belong in a Unity Catalog volume, not in the workspace file
  # tree. After `bundle deploy`, upload the CSVs with:
  #   databricks fs cp resources/data dbfs:/Volumes/workspace/default/raw_data --recursive --overwrite
  volumes:
    raw_data:
      catalog_name: workspace
      schema_name: default
      name: raw_data
      comment: "Raw CSVs for the NYC Service Gap Index (uploaded with databricks fs cp)"

  # --- Job: ingest the CSVs, then build the clean tables and the index ----
  # Runs on serverless compute (no cluster configuration needed).
  # Trigger it with: databricks bundle run build_tables --target dev
  jobs:
    build_tables:
      name: "NYC Service Gap Index - Build Tables"
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./resources/notebooks/ingest_raw_data.py
            base_parameters:
              data_dir: /Volumes/workspace/default/raw_data
        - task_key: build
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./resources/notebooks/build_notebook.sql
      # Optional: uncomment to rebuild every day at 06:00 UTC.
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"
      #   timezone_id: UTC
      #   pause_status: PAUSED

  # --- Dashboard: NYC Service Gap Dashboard -----------------------------------
  dashboards:
    zip_service_gap_index:
      display_name: "NYC Service Gap Dashboard"
      file_path: ./resources/dashboards/zip_service_gap_index_dashboard.json
      warehouse_id: ${var.warehouse_id}

# ---------------------------------------------------------------------------
# Workspace files deployed alongside the resources above.
# .py files are synced as notebooks you can also open and run interactively.
# ---------------------------------------------------------------------------
sync:
  # Reference material and repo housekeeping are not needed in the workspace.
  exclude:
    - "resources/data/**"
    - "hackathon-materials/**"
    - "docs/**"
    - ".gitignore"
  include:
    - ./resources/notebooks/ingest_raw_data.py
    - ./resources/notebooks/build_notebook.sql
    - ./resources/notebooks/key_decisions_notebook.sql
    - ./resources/dashboards/zip_service_gap_index_dashboard.json
    - ./README.md
